name: Deploy to pinsonbot.com server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack source
        run: tar --exclude='.git' --exclude='node_modules' --exclude='data' --exclude='.env' -czf /tmp/kidtodo.tar.gz . && cp /tmp/kidtodo.tar.gz kidtodo.tar.gz

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: kidtodo.tar.gz
          target: /opt/kidtodo-deploy/
          overwrite: true

      - name: Extract and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /opt/kidtodo
            tar -xzf /opt/kidtodo-deploy/kidtodo.tar.gz
            rm -f /opt/kidtodo-deploy/kidtodo.tar.gz
            npm install --omit=dev --silent
            pm2 restart kidtodo || pm2 start ecosystem.config.js
            pm2 save
            curl -sf http://127.0.0.1:3100/health
